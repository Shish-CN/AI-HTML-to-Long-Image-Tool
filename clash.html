<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VLESS · 批量转 Clash 配置</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: #f5f7fb;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 1.5rem;
    }
    .card {
      max-width: 1100px;
      width: 100%;
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 20px 35px -8px rgba(0, 0, 0, 0.15), 0 8px 16px -6px rgba(0, 0, 0, 0.05);
      padding: 2rem;
      transition: all 0.2s;
    }
    h1 {
      font-size: 1.9rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0 0 0.25rem 0;
      color: #0b1e33;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    h1 span {
      background: #eef2ff;
      color: #2e4b9c;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.2rem 1rem;
      border-radius: 100px;
      letter-spacing: 0.3px;
    }
    .subhead {
      color: #4a5b6e;
      margin-bottom: 1.8rem;
      font-size: 0.98rem;
      border-left: 4px solid #3b6eff;
      padding-left: 1rem;
      background: #f9faff;
      border-radius: 0 12px 12px 0;
      line-height: 1.5;
    }
    .subhead code {
      background: #e3e8f5;
      padding: 0.2rem 0.4rem;
      border-radius: 8px;
      font-size: 0.85rem;
      color: #1d2b4b;
      font-family: 'SF Mono', 'JetBrains Mono', monospace;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-bottom: 1.6rem;
    }
    .input-group label {
      font-weight: 500;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #2a3e5c;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .input-group label .hint {
      text-transform: none;
      font-weight: 400;
      font-size: 0.78rem;
      color: #7f92aa;
      letter-spacing: 0;
    }
    textarea {
      width: 100%;
      padding: 1rem 1.2rem;
      font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 0.9rem;
      border: 2px solid #dde3ed;
      border-radius: 22px;
      background: #ffffff;
      transition: border 0.2s, box-shadow 0.2s;
      resize: vertical;
      min-height: 160px;
      color: #0d1b2e;
      line-height: 1.6;
      outline: none;
    }
    textarea:focus {
      border-color: #3b6eff;
      box-shadow: 0 0 0 4px rgba(59, 110, 255, 0.12);
    }
    textarea::placeholder {
      color: #98a9c0;
      font-weight: 400;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin: 1.6rem 0 1.8rem;
    }
    .btn {
      border: none;
      padding: 0.9rem 2rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.98rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      transition: 0.18s ease;
      background: white;
      color: #1b2c4a;
      border: 1.5px solid #cdd7e8;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
      flex: 0 1 auto;
    }
    .btn-primary {
      background: #0e1f3d;
      border: 1.5px solid #0e1f3d;
      color: white;
      box-shadow: 0 8px 18px -6px rgba(14, 31, 61, 0.25);
    }
    .btn-primary:hover {
      background: #1a2f55;
      border-color: #1a2f55;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: white;
      border: 1.5px solid #cdd7e8;
      color: #1e3557;
    }
    .btn-secondary:hover {
      background: #f8faff;
      border-color: #a5b9d4;
      transform: translateY(-1px);
    }
    .btn:active {
      transform: translateY(1px);
      box-shadow: none;
    }
    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem 1.5rem;
      align-items: center;
      margin-bottom: 1rem;
      font-size: 0.85rem;
      color: #4d627a;
    }
    .stats .pill {
      background: #f0f4fe;
      border: 1px solid #d4e0fa;
      border-radius: 100px;
      padding: 0.25rem 0.9rem;
      font-weight: 500;
      color: #25407a;
    }
    .stats .pill.ok {
      background: #e6f6ed;
      border-color: #b9e3cc;
      color: #1c6b3f;
    }
    .stats .pill.err {
      background: #ffe9e7;
      border-color: #f5c4be;
      color: #a33830;
    }
    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 1rem 0 0.5rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .output-header h2 {
      font-size: 1.2rem;
      font-weight: 600;
      margin: 0;
      color: #122b44;
      letter-spacing: -0.2px;
    }
    .output-actions {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
    }
    .copy-badge {
      background: #eef2ff;
      border-radius: 30px;
      padding: 0.4rem 1.1rem;
      font-size: 0.82rem;
      font-weight: 500;
      color: #28438b;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: 0.15s;
      border: 1px solid #d0ddfa;
      user-select: none;
    }
    .copy-badge:hover {
      background: #dfe8ff;
      border-color: #a6bbf0;
    }
    .copy-badge.full {
      background: #0e1f3d;
      color: white;
      border-color: #0e1f3d;
    }
    .copy-badge.full:hover {
      background: #1a2f55;
      border-color: #1a2f55;
    }
    pre {
      background: #0b1424;
      color: #e1e9f5;
      padding: 1.5rem;
      border-radius: 24px;
      overflow-x: auto;
      font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 0.82rem;
      line-height: 1.65;
      margin: 0;
      white-space: pre;
      word-break: normal;
      border: 1px solid #1e2b42;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.4);
      max-height: 520px;
      overflow-y: auto;
    }
    .error-msg {
      margin-top: 0.8rem;
      color: #b3403a;
      background: #ffe9e7;
      padding: 0.8rem 1.2rem;
      border-radius: 16px;
      font-size: 0.9rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      border-left: 5px solid #c0392b;
    }
    .success-msg {
      color: #1c6b3f;
      background: #e6f6ed;
      border-left: 5px solid #2e9b5e;
    }
    .empty-state {
      color: #7c8ba5;
      text-align: center;
      padding: 2rem 1rem;
      font-style: italic;
      background: #f9fbfe;
      border-radius: 16px;
    }
    .error-list {
      margin-top: 0.8rem;
      font-size: 0.82rem;
      color: #7a4a45;
      background: #fff5f4;
      border: 1px solid #f5d0cc;
      border-radius: 14px;
      padding: 0.8rem 1.1rem;
      max-height: 160px;
      overflow-y: auto;
      line-height: 1.6;
    }
    .error-list strong {
      color: #a33830;
    }
    .footnote {
      margin-top: 1rem;
      font-size: 0.78rem;
      color: #7689a5;
      text-align: right;
    }
    .mt-2 {
      margin-top: 0.8rem;
    }
    @media (max-width: 640px) {
      .card { padding: 1.4rem; }
      h1 { font-size: 1.5rem; }
      .btn { padding: 0.75rem 1.4rem; font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>
      🔁 VLESS 批量转 Clash
      <span>Reality · 多行</span>
    </h1>
    <div class="subhead">
      ⚡ 每行粘贴一个 <code>vless://</code> 链接，批量解析为 Clash Meta 配置。空行与 <code>#</code> 开头的注释行会被自动忽略。
    </div>

    <!-- 输入区 -->
    <div class="input-group">
      <label for="vlessInput">
        <i>📎</i> VLESS 链接（每行一条）
        <span class="hint">支持多行批量输入</span>
      </label>
      <textarea id="vlessInput" placeholder="vless://86ea4ef9-6895-4a23-978d-6a6dcbc76e1a@154.201.88.214:33694?encryption=none&security=reality&flow=xtls-rprx-vision&type=tcp&sni=www.paypal.com&pbk=uQ0eHjbz8AYd0sbLkakytxCkyscWf1vexTB2qKHMvR4&fp=chrome#233boy-reality-154.201.88.214
vless://4d14373-9c64-46a5-a4fe-1b1f2f702328@tokyo.545287165.xyz:36780?encryption=none&security=reality&flow=xtls-rprx-vision&type=tcp&sni=tokyo.545287165.xyz&pbk=KXy2LB40L1kIVOyuiPjH4JT-YsU4djvedmp7XtJFzzA&fp=chrome&sid=6ba85179e30d4fc#jp_Reality"></textarea>
    </div>

    <!-- 按钮区 -->
    <div class="actions">
      <button class="btn btn-primary" id="convertBtn">✨ 批量转换</button>
      <button class="btn btn-secondary" id="clearBtn">🗑️ 清空</button>
      <button class="btn btn-secondary" id="exampleBtn">📋 填入示例</button>
    </div>

    <!-- 统计信息 -->
    <div class="stats" id="statsBox"></div>

    <!-- 输出区 -->
    <div class="output-header">
      <h2>📄 Clash Meta 配置（Proxies 列表）</h2>
      <div class="output-actions">
        <div class="copy-badge" id="copyProxiesBtn">
          <span>📋</span> 复制 proxies 数组
        </div>
        <div class="copy-badge full" id="copyFullBtn">
          <span>📋</span> 复制完整 YAML
        </div>
      </div>
    </div>
    <pre id="outputYaml" class="empty-state">— 转换结果将显示在这里 —</pre>
    <div id="messageBox"></div>
    <div id="errorList" class="error-list" style="display: none;"></div>
    <div class="footnote">
      支持 reality / vision / tcp / sni / 指纹  |  短ID 自动识别 <code style="background:#d9e2f0; padding:0.1rem 0.3rem; border-radius:6px;">sid</code> / <code style="background:#d9e2f0; padding:0.1rem 0.3rem; border-radius:6px;">shortId</code>
    </div>
  </div>

  <script>
    (function() {
      // DOM 元素
      const inputEl = document.getElementById('vlessInput');
      const convertBtn = document.getElementById('convertBtn');
      const clearBtn = document.getElementById('clearBtn');
      const exampleBtn = document.getElementById('exampleBtn');
      const outputEl = document.getElementById('outputYaml');
      const copyProxiesBtn = document.getElementById('copyProxiesBtn');
      const copyFullBtn = document.getElementById('copyFullBtn');
      const messageBox = document.getElementById('messageBox');
      const statsBox = document.getElementById('statsBox');
      const errorListEl = document.getElementById('errorList');

      // 示例链接（包含两条）
      const EXAMPLE_LINKS = [
        'vless://86ea4ef9-6895-4a23-978d-6a6dcbc76e1a@154.201.88.214:33694?encryption=none&security=reality&flow=xtls-rprx-vision&type=tcp&sni=www.paypal.com&pbk=uQ0eHjbz8AYd0sbLkakytxCkyscWf1vexTB2qKHMvR4&fp=chrome#233boy-reality-154.201.88.214',
        'vless://4d14373-9c64-46a5-a4fe-1b1f2f702328@tokyo.545287165.xyz:36780?encryption=none&security=reality&flow=xtls-rprx-vision&type=tcp&sni=tokyo.545287165.xyz&pbk=KXy2LB40L1kIVOyuiPjH4JT-YsU4djvedmp7XtJFzzA&fp=chrome&sid=6ba85179e30d4fc#jp_Reality'
      ].join('\n');

      // 存放最近一次成功转换的结果
      let lastProxies = [];
      let lastFullYaml = '';

      // ---------- 工具函数 ----------

      function showMessage(text, type = 'info') {
        messageBox.innerHTML = '';
        if (!text) return;
        const msgDiv = document.createElement('div');
        msgDiv.className = type === 'error' ? 'error-msg' : (type === 'success' ? 'error-msg success-msg' : 'error-msg');
        msgDiv.style.background = type === 'error' ? '#ffe9e7' : (type === 'success' ? '#e6f6ed' : '#eef2fa');
        msgDiv.style.color = type === 'error' ? '#b3403a' : (type === 'success' ? '#1c6b3f' : '#2f405e');
        msgDiv.style.borderLeftColor = type === 'error' ? '#c0392b' : (type === 'success' ? '#2e9b5e' : '#3b6eff');
        msgDiv.innerHTML = (type === 'error' ? '⚠️ ' : (type === 'success' ? '✅ ' : 'ℹ️ ')) + text;
        messageBox.appendChild(msgDiv);
      }

      function clearOutput() {
        outputEl.textContent = '— 转换结果将显示在这里 —';
        outputEl.className = 'empty-state';
        messageBox.innerHTML = '';
        statsBox.innerHTML = '';
        errorListEl.style.display = 'none';
        errorListEl.innerHTML = '';
        lastProxies = [];
        lastFullYaml = '';
      }

      // YAML 字符串转义
      function escapeYamlString(str) {
        if (str === null || str === undefined) return '""';
        const s = String(str);
        if (s === '') return '""';
        // 如果包含特殊字符则加双引号
        if (/[\s,{}[\]:"'#&*!|>%@`]/.test(s)) {
          const escaped = s.replace(/\\/g, '\\\\').replace(/"/g, '\\"');
          return `"${escaped}"`;
        }
        return s;
      }

      /**
       * 解析单条 VLESS 链接
       */
      function parseVlessLink(raw) {
        const trimmed = raw.trim();
        if (!trimmed.startsWith('vless://')) {
          throw new Error('链接必须以 vless:// 开头');
        }

        const withoutScheme = trimmed.slice('vless://'.length);

        // fragment
        let fragment = '';
        let mainPart = withoutScheme;
        const hashIndex = withoutScheme.indexOf('#');
        if (hashIndex !== -1) {
          fragment = decodeURIComponent(withoutScheme.slice(hashIndex + 1));
          mainPart = withoutScheme.slice(0, hashIndex);
        }

        // query
        let query = '';
        let beforeQuery = mainPart;
        const queryIndex = mainPart.indexOf('?');
        if (queryIndex !== -1) {
          query = mainPart.slice(queryIndex + 1);
          beforeQuery = mainPart.slice(0, queryIndex);
        }

        // uuid@host:port
        const atIndex = beforeQuery.indexOf('@');
        if (atIndex === -1) {
          throw new Error('链接格式错误: 缺少 @ 符号');
        }

        const uuid = beforeQuery.slice(0, atIndex).trim();
        const hostPort = beforeQuery.slice(atIndex + 1).trim();

        const lastColonIndex = hostPort.lastIndexOf(':');
        if (lastColonIndex === -1) {
          throw new Error('链接格式错误: 缺少端口');
        }

        const server = hostPort.slice(0, lastColonIndex).trim();
        const portStr = hostPort.slice(lastColonIndex + 1).trim();
        const port = parseInt(portStr, 10);
        if (isNaN(port) || port <= 0 || port > 65535) {
          throw new Error(`端口无效: ${portStr}`);
        }

        if (!uuid) throw new Error('UUID 不能为空');
        if (!server) throw new Error('服务器地址不能为空');

        // 解析 query
        const params = {};
        if (query) {
          query.split('&').forEach(pair => {
            if (!pair) return;
            const eqIndex = pair.indexOf('=');
            let key, value;
            if (eqIndex === -1) {
              key = pair;
              value = '';
            } else {
              key = pair.slice(0, eqIndex);
              value = pair.slice(eqIndex + 1);
            }
            try {
              params[decodeURIComponent(key)] = decodeURIComponent(value);
            } catch (e) {
              params[key] = value;
            }
          });
        }

        const security = params.security || 'none';
        const flow = params.flow || '';
        const type = params.type || 'tcp';
        const sni = params.sni || params.servername || '';
        const pbk = params.pbk || '';
        const fp = params.fp || 'chrome';
        const shortId = params.sid || params.shortId || '';
        const encryption = params.encryption || 'none';

        const isReality = security === 'reality' || (pbk && pbk.length > 0);

        return {
          uuid, server, port, fragment,
          security, flow, type, sni, pbk, fp, shortId, encryption, isReality
        };
      }

      /**
       * 生成单行 Clash proxy 字符串
       */
      function generateClashProxy(parsed, index) {
        const {
          uuid, server, port, fragment,
          flow, type, sni, pbk, fp, shortId, isReality
        } = parsed;

        const name = fragment ? fragment : `vless-node-${index + 1}`;

        // tls 判断
        let finalTls = false;
        if (parsed.security === 'reality' || parsed.security === 'tls' || (pbk && pbk.length > 0)) {
          finalTls = true;
        } else if (parsed.security === 'none') {
          finalTls = false;
        } else {
          finalTls = !!(sni && sni.length > 0);
        }

        const servername = sni || '';
        const publicKey = pbk || '';
        const shortIdStr = shortId || '';
        const clientFingerprint = fp || 'chrome';
        const flowValue = flow || 'xtls-rprx-vision';

        // 手工拼 YAML 一行
        const parts = [];
        parts.push(`name: ${escapeYamlString(name)}`);
        parts.push(`server: ${escapeYamlString(server)}`);
        parts.push(`port: ${port}`);
        parts.push(`type: vless`);
        parts.push(`uuid: ${escapeYamlString(uuid)}`);
        parts.push(`tls: ${finalTls}`);
        parts.push(`tfo: false`);
        parts.push(`flow: ${escapeYamlString(flowValue)}`);
        parts.push(`skip-cert-verify: false`);
        // reality-opts
        const shortIdRendered = shortIdStr ? `"${escapeYamlString(shortIdStr)}"` : `""`;
        parts.push(`reality-opts: {public-key: ${escapeYamlString(publicKey)}, short-id: ${shortIdRendered}}`);
        parts.push(`servername: ${escapeYamlString(servername)}`);
        parts.push(`client-fingerprint: ${escapeYamlString(clientFingerprint)}`);
        parts.push(`network: ${escapeYamlString(type)}`);

        return `- {${parts.join(', ')}}`;
      }

      // ---------- 核心批量转换 ----------
      function batchConvert() {
        const rawInput = inputEl.value;
        if (!rawInput.trim()) {
          showMessage('请先输入至少一条 VLESS 链接', 'error');
          clearOutput();
          return;
        }

        // 按行拆分，过滤空行和注释行
        const lines = rawInput.split(/\r?\n/)
          .map(l => l.trim())
          .filter(l => l && !l.startsWith('#'));

        if (lines.length === 0) {
          showMessage('未找到有效链接（空行与 # 注释已被忽略）', 'error');
          clearOutput();
          return;
        }

        const proxies = [];
        const errors = [];
        let successCount = 0;

        lines.forEach((line, idx) => {
          // 如果一行里有多个 vless:// 链接? 常见于粘贴错误，这里简单处理：以 vless:// 分隔
          // 但一般情况是一行一个链接。我们按 vless:// 切分，确保不会漏掉合并在一行的情况
          const segments = line.split(/(?=vless:\/\/)/i).filter(s => s.trim().length > 0);
          segments.forEach(seg => {
            const link = seg.trim();
            if (!link) return;
            try {
              const parsed = parseVlessLink(link);
              const proxyLine = generateClashProxy(parsed, successCount);
              proxies.push(proxyLine);
              successCount++;
            } catch (err) {
              errors.push({ line: line.length > 80 ? line.slice(0, 80) + '...' : line, message: err.message });
            }
          });
        });

        // 更新统计
        const totalLinks = successCount + errors.length;
        statsBox.innerHTML = `
          <span class="pill">📥 输入链接：${totalLinks}</span>
          <span class="pill ok">✅ 成功：${successCount}</span>
          ${errors.length > 0 ? `<span class="pill err">❌ 失败：${errors.length}</span>` : ''}
        `;

        if (proxies.length === 0) {
          clearOutput();
          statsBox.innerHTML = `<span class="pill err">❌ 全部失败</span>`;
          showMessage('没有成功转换的链接，请检查格式', 'error');
          renderErrors(errors);
          return;
        }

        // 生成 proxies 数组内容
        const proxiesContent = proxies.join('\n');

        // 生成完整 YAML
        const fullYaml = `proxies:\n${proxiesContent}`;

        lastProxies = proxies;
        lastFullYaml = fullYaml;

        outputEl.textContent = proxiesContent;
        outputEl.className = '';

        if (errors.length > 0) {
          showMessage(`转换完成：成功 ${successCount} 条，失败 ${errors.length} 条（详见下方）`, 'info');
          renderErrors(errors);
        } else {
          showMessage(`转换成功！共 ${successCount} 条配置`, 'success');
          errorListEl.style.display = 'none';
          errorListEl.innerHTML = '';
        }
      }

      function renderErrors(errors) {
        if (!errors.length) {
          errorListEl.style.display = 'none';
          errorListEl.innerHTML = '';
          return;
        }
        errorListEl.style.display = 'block';
        const items = errors.map((e, i) =>
          `<div>❌ <strong>第 ${i + 1} 个错误：</strong>${escapeHtml(e.message)}<br><span style="color:#8a6a66; font-size:0.78rem;">${escapeHtml(e.line)}</span></div>`
        ).join('<hr style="border:none;border-top:1px dashed #f0c8c4;margin:6px 0;">');
        errorListEl.innerHTML = `<strong>⚠️ 失败详情 (${errors.length} 条)</strong>${items}`;
      }

      function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>"]/g, function(m) {
          if (m === '&') return '&amp;';
          if (m === '<') return '&lt;';
          if (m === '>') return '&gt;';
          if (m === '"') return '&quot;';
          return m;
        });
      }

      // ---------- 复制功能 ----------
      function copyText(text, successMsg) {
        if (!text) {
          showMessage('没有可复制的内容', 'error');
          return;
        }
        navigator.clipboard.writeText(text).then(() => {
          showMessage(successMsg, 'success');
        }).catch(() => {
          try {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showMessage(successMsg + ' (fallback)', 'success');
          } catch (e) {
            showMessage('复制失败，请手动选择复制', 'error');
          }
        });
      }

      function copyProxies() {
        if (lastProxies.length === 0) {
          showMessage('请先进行转换', 'error');
          return;
        }
        const text = lastProxies.join('\n');
        copyText(text, 'proxies 数组已复制到剪贴板');
      }

      function copyFull() {
        if (!lastFullYaml) {
          showMessage('请先进行转换', 'error');
          return;
        }
        copyText(lastFullYaml, '完整 YAML 已复制到剪贴板');
      }

      // ---------- 事件绑定 ----------
      convertBtn.addEventListener('click', batchConvert);
      clearBtn.addEventListener('click', () => {
        inputEl.value = '';
        clearOutput();
        inputEl.focus();
      });
      exampleBtn.addEventListener('click', () => {
        inputEl.value = EXAMPLE_LINKS;
        batchConvert();
      });
      copyProxiesBtn.addEventListener('click', copyProxies);
      copyFullBtn.addEventListener('click', copyFull);

      // Ctrl+Enter 快捷转换
      inputEl.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
          e.preventDefault();
          batchConvert();
        }
      });

      // 初始化
      clearOutput();
    })();
  </script>
</body>
</html>
